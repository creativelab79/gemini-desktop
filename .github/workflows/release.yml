name: Build and Release Gemini Desktop

on:
  push:
    tags:
      - 'v*'   # Runs when you push a version tag like v1.0.0

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Set GitHub token for electron-builder
        run: echo "GH_TOKEN=${{ secrets.GH_PAT }}" >> $GITHUB_ENV

      - name: Build Windows installer
        run: npm run dist -- --win --publish=never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*

  build-macos:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Set GitHub token for electron-builder
        run: echo "GH_TOKEN=${{ secrets.GH_PAT }}" >> $GITHUB_ENV

      - name: Build macOS installer
        run: npm run dist -- --mac --publish=never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          body: |
            Gemini Desktop v1.0.10
            - Windows and macOS installers included
            - Built with Node.js 22
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}




